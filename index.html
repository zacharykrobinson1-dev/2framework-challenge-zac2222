<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visa – Home</title>

    <!-- 4 no-class frameworks -->
    <link rel="stylesheet" href="https://unpkg.com/mvp.css">
    <link rel="stylesheet" href="https://unpkg.com/water.css@2/out/water.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sakura.css/css/sakura.css">
    <link rel="stylesheet" href="https://unpkg.com/tufte-css@1.7.5/css/tufte.min.css">

    <link rel="stylesheet" href="screen.css">
  </head>
  <body>

    <h1>Visa – Global Payments</h1>
    <p>Secure, fast, and accepted worldwide.</p>

    <nav>
      <ul>
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>

    <!-- Language selector – pure HTML/CSS -->
    <details open style="margin:2rem auto; max-width:400px;">
      <summary style="cursor:pointer; font-weight:bold; text-align:center; padding:0.5rem;">
        Select Language
      </summary>

      <div style="padding:1rem; background:white; border:1px solid #ddd; border-radius:8px; margin-top:0.5rem;">
        <form>
          <select style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ccc; border-radius:4px;">
            <option>English</option>
            <option>Español</option>
            <option>Français</option>
            <option>Deutsch</option>
            <option>中文</option>
            <option>日本語</option>
          </select>
          <button type="button" style="background:#003087; color:white; width:100%; padding:10px; border:none; border-radius:4px; cursor:pointer;">
            Apply
          </button>
        </form>
      </div>
    </details>

    <!-- Optional: decorative note (no JS needed) -->
    <p style="font-size:0.9rem; color:#666; text-align:center;">
      *Language selection is visual only in this demo.
    </p>

  </body>
</html>
