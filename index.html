<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visa – Global Payments</title>

    <!-- 4 no-class frameworks -->
    <link rel="stylesheet" href="https://unpkg.com/mvp.css">
    <link rel="stylesheet" href="https://unpkg.com/water.css@2/out/water.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sakura.css/css/sakura.css">
    <link rel="stylesheet" href="https://unpkg.com/tufte-css@1.7.5/css/tufte.min.css">

    <!-- Custom professional styling -->
    <link rel="stylesheet" href="screen.css">
  </head>
  <body>

    <!-- Sticky Header -->
    <header class="site-header">
      <div class="container">
        <h1>Visa</h1>
        <nav>
          <ul>
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="about.html">About</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- Main Content -->
    <main class="container">
      <section class="hero">
        <h2>Global Payments, Simplified</h2>
        <p>Secure, fast, and accepted in over 200 countries.</p>
      </section>

      <!-- Language Selector Card -->
      <section class="lang-card">
        <h3>Select Your Language</h3>
        <form>
          <select>
            <option>English</option>
            <option>Español</option>
            <option>Français</option>
            <option>Deutsch</option>
            <option>中文</option>
            <option>日本語</option>
          </select>
          <button type="button">Apply</button>
        </form>
        <p class="note">*Language selection is visual only in this demo.</p>
      </section>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <div class="container">
        <p>&copy; 2025 Visa Inc. All rights reserved.</p>
      </div>
    </footer>
